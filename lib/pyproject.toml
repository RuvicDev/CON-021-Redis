[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ruvic-redis-connector"
version = "1.0.0"
description = "Conector Ruvic de lectura y escritura de claves en Redis"
requires-python = ">=3.10"
dependencies = [
    "redis>=5.0,<6.0",
]

[tool.setuptools.packages.find]
include = ["ruvic_redis_connector*"]
